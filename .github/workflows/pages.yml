# Publishes the game to GitHub Pages so it can be opened on a phone without a LAN dev server:
#   https://kriptoloca.github.io/peek-and-find/        production build (what the ZIP will contain)
#   https://kriptoloca.github.io/peek-and-find/test/   development-mode build: dev shortcuts
#                                                      (?level=, ?mode=, ?fakeads=1, ?adfast=1,
#                                                      ?reset=1, dev menu, __peekDebug) enabled
# Both run on the Bridge "mock" platform (no ads, localStorage saves) because the host is not
# YouTube. Pages must be allowed for the repository (Settings → Pages → Source: GitHub Actions).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vite build --mode development --outDir dist/test
      - run: node scripts/audit-dist.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
